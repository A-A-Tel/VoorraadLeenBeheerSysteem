on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore
        run: dotnet restore StorageBorrowManagement.sln

      - name: Test
        run: dotnet test StorageBorrowManagement.sln --no-restore
